versioning:
  style: path-segment
  lockstep: false
  detail: >-
    Each surface carries its own major version in the URL path and they move independently:
    justtrack Management /management/v1, justtrack Reporting /reporting/v2 (v1 still documented side by side),
    justtrack AppEvent /appevents/v1, justtrack Revenue sink /monetization/v0, adjoe SSP revenue /v2/ssp-api,
    adjoe user ad data report /v3/ssp-api. The revenue sink is still on v0.
  sdk_versioning: semver, per platform, with the native Android/iOS versions kept aligned
  spec_version: both published OpenAPI documents declare info.version "v1.0.0"

deprecation:
  policy_published: partial
  http_headers:
    sunset: not sent
    deprecation: not sent
    rfc8594: false
  detail: >-
    There is no written deprecation policy for the HTTP APIs — no notice period, no Sunset/Deprecation headers, and
    no `deprecated: true` flag on any operation in either OpenAPI document. What the group does publish is an
    SDK-level sunset, with a hard date and named versions, plus method-level deprecations announced in the
    changelogs.
  announced_sunsets:
  - brand: adjoe
    product: Playtime SDK
    effective: '2026-09-01'
    scope: 'Android <= v3.4.0; iOS <= v1.9.1'
    statement: >-
      "From 1st September 2026, we will stop supporting these older SDK versions and sunset them. Failure to upgrade
      ahead of this window may result in Playtime SDK build failures."
    migration_guide: https://docs.adjoe.io/rewarded-solutions/playtime-sdk-integration/migrate-to-playtime-sdk-v4
    evidence: https://docs.adjoe.io/rewarded-solutions/playtime-sdk-integration/changelog
  advisories:
  - brand: adjoe
    scope: 'Android SDK v4.4.0 - v4.5.1'
    statement: >-
      Known issue causing initialization latency on lower-end Android devices; these versions "should not be used".
    fixed_in: 4.5.2
  deprecated_methods:
  - brand: justtrack
    symbol: .publishEvent()
    deprecated_in: 7.1.0
    replacement: .track()
    date: '2026-03-06'
  - brand: justtrack
    symbol: JusttrackSdk.getTestGroupId()
    deprecated_in: 5.1.0
    date: '2025-09-08'
  breaking_releases:
  - brand: justtrack
    version: 6.0.0
    date: '2026-01-23'
    change: Automatic third-party integration support removed; AppLovin/Firebase/ironSource split into adapter modules.
  deprecated_operations_in_spec: []

