aid: applike
name: AppLike Group
description: >-
  AppLike Group is a Hamburg, Germany-based company builder in the mobile app economy, founded in 2015 by Jonas
  Thiemann and Carlo Szelinsky and backed by Bertelsmann. The group operates four independent businesses that cover
  the mobile app value chain: adjoe (rewarded user acquisition, the Playtime engagement ad format, the Arcade loyalty
  layer and a programmatic ads platform), justtrack (mobile attribution, user-acquisition automation, cohort and
  monetization analytics), JustDice (app-discovery products for mobile gamers) and Sunday (mobile game development
  and publishing). Two of the four brands publish public developer surfaces: justtrack ships OpenAPI 3.1 contracts
  for its Management and AppEvent APIs plus documented Reporting, Revenue Events and Raw Data Export interfaces, and
  adjoe publishes SSP reporting APIs and a server-to-server rewarded-payout callback alongside Android, iOS, Unity,
  Flutter, React Native and Cordova SDKs.
