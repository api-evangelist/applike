- aid: applike:applike-bids-api
  name: AppLike Group Bids API
  description: >-
    Bidding operates as a distributed transaction. The sequential flow is as follows:
      1. you upload a bid
      2. we store it in justtrack -> status: pending
      3. we try to apply it on partner side <br/>
        a. if successful -> status: success <br/>
        b. if error: we rollback the change by fetching the current value from partner -> status: rollback-error
    <br/>
          b.1. rollback succeeded -> status: rollback-error <br/>
          b.2. rollback-failed -> status: error <br/>
      4. We update the bid based on the returning status. In the case of newly creation bids, this includes
    deleting them to ensure a consistent state between justtrack and the partner.

    This process can take up to 30 minutes for rollbacks. Only then you will see a stable status.


    **NOTE:** We gather bids and apply them on the partner side in batches. This increases throughput
    and overall speed in which changes are applied. As a downside, if one bid in one batch fails, mostly
    the entire batch is rejected and enters the rollback process.
  humanURL: https://docs.justtrack.io/api/management/management-api/
  baseURL: https://api.justtrack.io
