- name: justtrack Reporting API
  description: >-
    Reporting API exposing the metrics behind the justtrack dashboard — acquisition tables, cohort analysis
    and event drill-down — as POST endpoints under /reporting/v2 (v1 also documented). Requests carry
    cohort, interval, metrics, dimensions, filters, pagination and orderBy objects. Authenticated with
    X-API-Key. Documented in prose only; no OpenAPI contract is published for this API.
  humanURL: https://docs.justtrack.io/api/reporting-api/
