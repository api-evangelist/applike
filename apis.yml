apis:
- name: justtrack Management API
  description: >-
    REST API to manage justtrack apps, campaigns, partners, partner-feature configurations and bids. Published as an
    OpenAPI 3.1.0 contract (v1.0.0) covering twelve operations across six tags, authenticated with an X-API-Key
    header and paginated with an offset/limit page object. Available on the justtrack Pro plan.
  humanURL: https://docs.justtrack.io/api/management/management-api/
  baseURL: https://api.justtrack.io
  tags:
  - user-acquisition
  - mobile-attribution
  - campaign-management
  - adtech
