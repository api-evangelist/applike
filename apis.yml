- name: justtrack AppEvent API
  description: >-
    Server-to-server batch ingestion API for in-app events. A single POST /appevents/v1 operation accepts an array of
    per-app/per-user event batches, each carrying a client-supplied uuid4 batchId and per-event uuid4 id used for
    deduplication, and answers 207 with a per-batch error array on partial success. Published as OpenAPI 3.1.0.
  humanURL: https://docs.justtrack.io/api/app-events/appevent-api/
  baseURL: https://app-events.justtrack.io
  tags:
  - event-tracking
  - mobile-analytics
  - server-to-server
  properties:
  - type: OpenAPI
    url: openapi/applike-justtrack-app-events-openapi.yml
  - type: Documentation
    url: https://docs.justtrack.io/api/app-events/appevent-api/
  - type: APIReference
    url: https://docs.justtrack.io/api/app-events/post-app-event-batch/
  - type: Authentication
    url: authentication/applike-authentication.yml
  - type: Conventions
    url: conventions/applike-conventions.yml
  - type: ErrorCatalog
    url: errors/applike-problem-types.yml
  - type: Overlay
    url: overlays/applike-justtrack-app-events-overlay.yaml
- name: justtrack Reporting API
  description: >-
    Reporting API exposing the metrics behind the justtrack dashboard — acquisition tables, cohort analysis and event
    drill-down — as POST endpoints under /reporting/v2 (v1 also documented). Requests carry cohort, interval, metrics,
    dimensions, filters, pagination and orderBy objects. Authenticated with X-API-Key. Documented in prose only; no
    OpenAPI contract is published for this API.
  humanURL: https://docs.justtrack.io/api/reporting-api/
  baseURL: https://api.justtrack.io
  tags:
  - mobile-analytics
  - reporting
  - cohort-analysis
  properties:
  - type: Documentation
    url: https://docs.justtrack.io/api/reporting-api/
  - type: APIReference
    url: https://docs.justtrack.io/api/reporting-api/acquisition/
  - type: Authentication
    url: authentication/applike-authentication.yml
- name: justtrack Revenue Events API
  description: >-
    Server-to-server revenue postback sink. Monetization partners and customers send real-time revenue events as GET
    requests with query parameters to https://sink.justtrack.io/monetization/v0/{provider}/{platform}/{packageId},
    with a per-event transactionid used to trace and deduplicate. Thirteen named revenue providers have short handles;
    received postbacks can be forwarded on to a customer-configured URL.
  humanURL: https://docs.justtrack.io/api/revenue-events-api/
  baseURL: https://sink.justtrack.io
  tags:
  - app-monetization
  - event-tracking
  - webhooks
  properties:
  - type: Documentation
    url: https://docs.justtrack.io/api/revenue-events-api/
  - type: APIReference
    url: https://docs.justtrack.io/api/revenue-events-api/api-for-revenue-providers/
  - type: Webhooks
    url: asyncapi/applike-webhooks.yml
  - type: Authentication
    url: authentication/applike-authentication.yml
- name: adjoe SSP Revenue API
  description: >-
    Publisher-facing reporting API returning daily aggregated Playtime revenue, eCPM, offerwall shows, SDK bootups,
    first impressions, coin sums and view counts, groupable by up to eighteen dimensions. Two GET endpoints under
    https://prod.adjoe.zone/v2/ssp-api, authenticated with the publisher token in an X-API-KEY header, rate limited to
    5 requests/second sustained with a burst of 10 and X-RateLimit-* headers.
  humanURL: https://docs.adjoe.io/rewarded-solutions/reporting-apis/revenue-api
  baseURL: https://prod.adjoe.zone
  tags:
  - app-monetization
  - rewarded-advertising
  - reporting
  - adtech
  properties:
  - type: Documentation
    url: https://docs.adjoe.io/rewarded-solutions/reporting-apis/revenue-api
  - type: APIReference
    url: https://docs.adjoe.io/rewarded-solutions/reporting-apis/revenue-api
  - type: Authentication
    url: authentication/applike-authentication.yml
  - type: RateLimits
    url: rate-limits/applike-rate-limits.yml
  - type: Conventions
    url: conventions/applike-conventions.yml
- name: adjoe User Ad Data Report API
  description: >-
    Per-user ad data report download for Playtime publishers. A single GET
    /v3/ssp-api/user-ad-data-report/sdk/{sdkHash} endpoint returns a text/csv report for a given date, answering 202
    with a JSON body while the report is still being generated. Authenticated with the publisher token in an
    X-API-KEY header.
  humanURL: https://docs.adjoe.io/rewarded-solutions/reporting-apis/user-ad-data-report-api
  baseURL: https://prod.adjoe.zone
  tags:
  - app-monetization
  - reporting
  - adtech
  properties:
