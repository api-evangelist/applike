- aid: applike:applike-partner-configurations-api
  name: AppLike Group Partner Configurations API
  description: >-
    In justtrack, you integrate your app with the advertising partners that run your campaigns. Depending
    on the integrated partner, we exchange data for at least one of the following features:


    * `attribution`: Attribution tracking

    * `campaign`: Bid and campaign automation

    * `skad-import`: SKAd imports or tracking event-based SKAd data

    * `spend-import`: Spend imports or tracking event-based spend data

    * `tracking`: Tracking parameter macros (custom partners only)

    * `postback`: Send data to the partner via postbacks


    In order to properly exchange data with the partner, you need to configure specific partner settings.
    With this API, you can do this programmatically. More specifically, you can:


    - View all configurations we require to integrate a partner feature

    - Configure features for an app-partner combination

    - View all configured values for a given feature for an app-partner combination


    Because you configure features for every app-partner combination, if you want to configure features
    for multiple apps, you must call this endpoint for each app. For every feature, you must also configure
    all configurable settings.
  humanURL: https://docs.justtrack.io/api/management/management-api/
  baseURL: https://api.justtrack.io
  tags:
  - Partner Configurations
