- name: adjoe SSP Revenue API
  description: >-
    Publisher-facing reporting API returning daily aggregated Playtime revenue, eCPM, offerwall shows,
    SDK bootups, first impressions, coin sums and view counts, groupable by up to eighteen dimensions.
