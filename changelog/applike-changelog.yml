summary: >-
  Both brands publish a dated, per-version changelog — but both are SDK changelogs. Neither justtrack nor adjoe
  publishes a changelog for its HTTP APIs, so a server-side integrator has no record of when
  /management/v1, /reporting/v2, /appevents/v1 or the SSP endpoints changed. The two OpenAPI documents both sit at
  info.version "v1.0.0" with no release history behind them.
