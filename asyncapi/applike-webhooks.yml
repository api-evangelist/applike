  direction: inbound
  brand: justtrack
  name: Revenue Events API for customers
  description: Customers push their own revenue events into justtrack.
  method: GET
  endpoint: https://sink.justtrack.io/monetization/v0/jt
  auth: apikey query parameter
  required_parameters:
