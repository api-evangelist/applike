method: searched
source: >-
  openapi/applike-justtrack-management-openapi.yml, openapi/applike-justtrack-app-events-openapi.yml,
  https://docs.justtrack.io/api/overview/, https://docs.justtrack.io/api/revenue-events-api/api-for-customers/,
